</head>
<body>
  <div class="page" id="reader-page">
    <div class="page-inner reader-page-inner has-sidebar">
      <div class="desktop-sidebar" id="desktop-sidebar"></div>

      <div class="desktop-main">
        <div class="reader-topbar">
          <a class="reader-back" id="reader-back" href="volume.html?volume=1&scrollToToc=1">← 目錄</a>
          <span class="reader-title" id="article-title">文章標題</span>
          <div class="reader-top-links">
            <a href="index.html">首頁</a>
            <span class="top-link-sep">|</span>
            <a href="shelf.html">書架</a>
            <span class="top-link-sep">|</span>
            <a href="volume.html?volume=1&scrollToToc=1" id="reader-toc-link">目錄</a>
          </div>
          <div class="reader-lang" id="lang-toggle">
            <span class="lang-option active" data-lang="zh">中</span>
            <span class="lang-sep">|</span>
            <span class="lang-option" data-lang="en">EN</span>
          </div>
        </div>

        <div class="reader-progress-bar">
          <div class="progress-fill" id="progress-bar"></div>
        </div>

        <div class="reader-scroll" id="reader-scroll">
          <div class="reader-inner" id="reader-inner"></div>
        </div>

        <div class="reader-actions">
          <button class="action-btn" id="like-btn">
            <span class="btn-icon" id="like-icon">♡</span>
            <span class="btn-label">點讚</span>
            <span class="btn-count" id="like-count">0</span>
          </button>
          <button class="action-btn" id="share-btn">
            <span class="btn-icon">📤</span>
            <span class="btn-label">分享</span>
            <span class="btn-count" id="page-num">—</span>
          </button>
          <button class="action-btn" id="back-btn">
            <span class="btn-icon">📖</span>
            <span class="btn-label">回目錄</span>
            <span class="btn-count" id="stat-views">0</span>
          </button>
        </div>
      </div>
    </div>

    <div class="share-overlay" id="share-overlay">
      <div class="share-dialog">
        <div class="share-dialog-title">分享文章</div>
        <p class="share-wx-tip" id="share-wx-tip" style="display:none;"></p>
        <button class="share-wx-btn" id="share-friend-btn" type="button">
          <span class="share-wx-icon">💬</span>
          <span class="share-wx-label">分享給朋友</span>
        </button>
        <button class="share-wx-btn" id="share-timeline-btn" type="button">
          <span class="share-wx-icon">🌐</span>
          <span class="share-wx-label">分享到朋友圈</span>
        </button>
        <button class="share-wx-btn" id="share-copy-btn" type="button">
          <span class="share-wx-icon">🔗</span>
          <span class="share-wx-label">複製連結</span>
        </button>
        <button class="share-wx-btn" id="share-pdf-btn" type="button">
          <span class="share-wx-icon">📄</span>
          <span class="share-wx-label">下載／分享 PDF</span>
        </button>
        <button class="share-close-btn" id="share-close-btn" type="button">關閉</button>
      </div>
    </div>
  </div>
  <script src="js/article-pdf.js?v=20260731g"></script>
  <script src="js/reader.js?v=20260731f"></script>
</body>
</html>
