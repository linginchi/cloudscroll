name: Build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
        env:
          NODE_ENV: production
      - name: Build
        run: npm run build
        env:
          CF_PAGES: '1'
          CI: 'true'
      - name: Verify dist
        run: test -f dist/yunxin-article.html && test -f dist/css/yunxin.css && test -f dist/_worker.js
